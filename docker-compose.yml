# Image versions: every Migratrix image is pulled by a fixed tag from .env (AGENT_TAG, RISK_TAG, SQLGLOT_TAG,
# JAVA_ANALYZER_TAG, PYTHON_ANALYZER_TAG). The installer writes them from the released set (versions.env); there
# is no default and no "latest", so a machine never moves to another version on its own (onboarding trials D-08).
services:

  traefik:
    # A fixed minor line, not the floating "v3" (SEC-07). 3.6 is the first line that talks to Docker Engine 29.
    image: traefik:${TRAEFIK_TAG:-v3.6}
    container_name: migratrix-traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--entrypoints.agent.address=:4002"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "${AGENT_PORT:-4002}:4002"
      - "${HTTPS_PORT:-443}:443"
      # No dashboard port: Traefik's API and dashboard are off (they were open, without a login, on every
      # interface - SEC-07).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./certs:/certs:ro
    depends_on:
      - agent
      - risk-assessment

  agent:
    image: ${REGISTRY:-}migratrix-agent:${AGENT_TAG:?AGENT_TAG is not set in .env - run the installer, it writes the released image versions}
    container_name: migratrix-agent
    restart: unless-stopped
    # Replica workers finish the batch in hand, save the checkpoint and release their lease on a stop
    # (the host gives them 60 s); Docker's default of 10 s would kill the agent before that (LS2-08).
    stop_grace_period: 75s
    environment:
      # The agent key, from .env. Passed in the environment, not as a command argument: arguments show in the
      # process list of the host and of every container that shares its PID namespace (SEC-06).
      MIGRATRIX_API_KEY: "${MIGRATRIX_API_KEY:?MIGRATRIX_API_KEY is not set in .env - run the installer with the key from Settings > Agents}"
      ASPNETCORE_URLS: "http://0.0.0.0:4002"
      # The orchestrator this agent belongs to. The Platform's tokens are validated with the public keys it
      # publishes at /.well-known/jwks.json: the agent holds no key that could sign one.
      ApiSettings__BaseUrl: "${MIGRATRIX_ORCHESTRATOR_URL:-https://api.migratrix.com}"
      MIGRATRIX_DIR: /data/migratrix
      CERT_DIR: /certs
      TRAEFIK_DYNAMIC_DIR: /etc/traefik/dynamic
      AGENT_HOST: "${AGENT_HOST:-agent.localhost}"
      MIGRATRIX_MODE: "${MIGRATRIX_MODE:-localhost}"
      # The port the proxy publishes for the agent: with AGENT_HOST it is the address the agent tells the
      # Platform it is reached at (https://<AGENT_HOST>[:port]).
      AGENT_HTTPS_PORT: "${HTTPS_PORT:-443}"
      SqlGlot__BaseUrl: "http://sqlglot:5123"
      SqlGlot__Enabled: "true"
      # The Data MCP for AI assistants, at https://<AGENT_HOST>/mcp. TLS ends at Traefik, so the public name tokens
      # are minted for is given here. MIGRATRIX_DATA_MCP=off turns the endpoint off.
      MIGRATRIX_DATA_MCP: "${MIGRATRIX_DATA_MCP:-on}"
      MIGRATRIX_DATA_MCP_RESOURCE: "https://${AGENT_HOST:-agent.localhost}/mcp"
      # The Risk Assessment API beside the agent: turns on code_impact on the Executor MCP.
      MIGRATRIX_RISK_URL: "http://risk-assessment:4003"
      # Outgoing proxy, when the machine reaches Migratrix through one (the installer's --proxy / -Proxy, or
      # HTTPS_PROXY of its environment). Under MIGRATRIX_* names in .env, so that a NO_PROXY of the shell that
      # runs docker compose does not replace the list with the container names in it. Empty: no proxy.
      HTTPS_PROXY: "${MIGRATRIX_HTTPS_PROXY:-}"
      HTTP_PROXY: "${MIGRATRIX_HTTP_PROXY:-}"
      NO_PROXY: "${MIGRATRIX_NO_PROXY:-}"
      # The CA list the agent trusts. The default is the image's own list. With an extra CA (a proxy that
      # inspects TLS; the installer's --ca-file / -CaFile) it is /certs/ca-bundle.pem: the image's list plus
      # that CA. The variable replaces the list, so it must never name a file with the extra CA alone.
      SSL_CERT_FILE: "${MIGRATRIX_SSL_CERT_FILE:-/etc/ssl/certs/ca-certificates.crt}"
      # Set by the installer's --replace / -Replace for one start: take over from another installation that is
      # connected with the same key. The agent remembers the value it used and ignores it afterwards.
      MIGRATRIX_AGENT_REPLACE: "${MIGRATRIX_AGENT_REPLACE:-}"
    volumes:
      - migratrix-data:/data/migratrix
      - ./certs:/certs
      - ./traefik/dynamic:/etc/traefik/dynamic
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - risk-assessment
      - sqlglot
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agent.entrypoints=websecure"
      - "traefik.http.routers.agent.rule=PathPrefix(`/`)"
      - "traefik.http.routers.agent.tls=true"
      - "traefik.http.routers.agent.priority=1"
      - "traefik.http.services.agent.loadbalancer.server.port=4002"
      - "traefik.http.services.agent.loadbalancer.server.scheme=http"

  risk-assessment:
    image: ${REGISTRY:-}migratrix-risk-assessment:${RISK_TAG:?RISK_TAG is not set in .env - run the installer, it writes the released image versions}
    container_name: migratrix-risk-assessment
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:4003"
      # Validates the Platform's tokens with the orchestrator's published public keys, like the agent.
      ApiSettings__BaseUrl: "${MIGRATRIX_ORCHESTRATOR_URL:-https://api.migratrix.com}"
      JavaGrpc__Endpoint:   "http://java-analyzer:50051"
      PythonGrpc__Endpoint: "http://python-analyzer:50052"
      SqlGlot__BaseUrl:     "http://sqlglot:5123"
      SqlGlot__Enabled:     "true"
      # Push webhooks reindex the changed files (https://<AGENT_HOST>/webhooks/github or /webhooks/gitlab). Without a
      # secret the endpoint answers 503. The installer generates the GitHub secret; enter the same value as the
      # webhook's Secret in GitHub (content type application/json, push events).
      Webhooks__GitHubSecret: "${MIGRATRIX_GITHUB_WEBHOOK_SECRET:-}"
      Webhooks__GitLabToken:  "${MIGRATRIX_GITLAB_WEBHOOK_TOKEN:-}"
      # The Platform origin the Risk page is opened from, when it is not the hosted Platform (on-prem).
      Cors__AllowedOrigins__0: "${MIGRATRIX_PLATFORM_ORIGIN:-}"
      # The same outgoing proxy and CA list as the agent (the orchestrator's public keys, repository hosts).
      HTTPS_PROXY: "${MIGRATRIX_HTTPS_PROXY:-}"
      HTTP_PROXY: "${MIGRATRIX_HTTP_PROXY:-}"
      NO_PROXY: "${MIGRATRIX_NO_PROXY:-}"
      SSL_CERT_FILE: "${MIGRATRIX_SSL_CERT_FILE:-/etc/ssl/certs/ca-certificates.crt}"
    volumes:
      - migratrix-data:/data/migratrix
      - ./certs:/certs:ro
    depends_on:
      - java-analyzer
      - python-analyzer
      - sqlglot
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.risk.entrypoints=websecure"
      - "traefik.http.routers.risk.rule=PathPrefix(`/hubs/riskAssessment`) || PathPrefix(`/webhooks/github`) || PathPrefix(`/webhooks/gitlab`)"
      - "traefik.http.routers.risk.tls=true"
      - "traefik.http.routers.risk.priority=10"
      - "traefik.http.services.risk.loadbalancer.server.port=4003"
      - "traefik.http.services.risk.loadbalancer.server.scheme=http"

  java-analyzer:
    image: ${REGISTRY:-}migratrix-java-analyzer:${JAVA_ANALYZER_TAG:?JAVA_ANALYZER_TAG is not set in .env - run the installer, it writes the released image versions}
    container_name: migratrix-java-analyzer
    restart: unless-stopped

  python-analyzer:
    image: ${REGISTRY:-}migratrix-python-analyzer:${PYTHON_ANALYZER_TAG:?PYTHON_ANALYZER_TAG is not set in .env - run the installer, it writes the released image versions}
    container_name: migratrix-python-analyzer
    restart: unless-stopped

  sqlglot:
    image: ${REGISTRY:-}migratrix-sqlglot-parser:${SQLGLOT_TAG:?SQLGLOT_TAG is not set in .env - run the installer, it writes the released image versions}
    container_name: migratrix-sqlglot
    restart: unless-stopped

volumes:
  migratrix-data:
